<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Cloud Tao · A* 寻路模块</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14231f;color:#f1ebdd;font-family:system-ui,"Microsoft YaHei",sans-serif}
    #app{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#49675e,#14231f 78%)}
    #game{display:block;max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 20px 70px #0008;touch-action:none;cursor:crosshair}
    .hud{position:fixed;left:16px;top:16px;display:flex;gap:8px;align-items:center;padding:9px 12px;background:#202d2ad9;border:1px solid #c8a46a;backdrop-filter:blur(7px);pointer-events:none}
    .hud b{color:#e2c17f}.hud small{opacity:.8}
    #debug{position:fixed;right:16px;top:16px;border:1px solid #c8a46a;background:#202d2ae8;color:#f1ebdd;padding:10px 14px;cursor:pointer}
    #debug.active{background:#8d3f35;color:#fff}
    #status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 16px;background:#202d2ad9;border:1px solid #c8a46a;white-space:nowrap}
    @media(max-width:640px){.hud{top:auto;bottom:58px;left:8px;font-size:12px}#debug{right:8px;top:8px}#status{bottom:8px;font-size:12px}}
  </style>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Cloud Tao 可探索地图"></canvas>
    <div class="hud"><b>Cloud Tao</b><small>点击寻路 · WASD 自由移动</small></div>
    <button id="debug" type="button">显示碰撞网格</button>
    <div id="status">正在读取地图像素…</div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
